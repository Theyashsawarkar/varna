name: Bug report
description: Something in varna doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `varna --version` and `varna doctor`, your distribution and which tools you use.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output and log
      description: The command you ran, its output, and the theme file if it's your own.
      render: text
