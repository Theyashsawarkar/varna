# mako's config includes this (include=~/.local/state/varna/mako.conf).
# The same glass as every panel (ui.glass), and the interface font, not mono.
background-color={{crust}}{{glass_aa}}
font={{font}} 12
text-color={{text}}
border-color={{accent:a=0.55}}
progress-color=over {{surface0}}

[urgency=critical]
border-color={{urgent}}

[urgency=low]
border-color={{surface2}}
