# tmux.conf sources this last: the theme's colours as @variables (the bar
# and popups read them when drawn) and the styles that can't use variables.
set -g @accent "{{accent}}"
set -g @accent2 "{{accent2}}"
set -g @rose "{{accent2}}"
set -g @ink "{{ink}}"
set -g @fg "{{fg}}"
set -g @muted "{{muted}}"
set -g @line "{{line}}"
set -g @match "{{match}}"
set -g @mark "{{mark}}"
# The bar: a solid capsule means "look here" (the session and its prefix /
# copy-mode states, the current window, Claude waiting, usage full); the
# rest are soft pills (@soft_bg, the icon in its own colour), like waybar.
# The solid ones must all differ: tests/test_varna.py checks every theme.
set -g @prefix "{{prefix|fg}}"
set -g @copy "{{copy|match}}"
set -g @window "{{window|accent2}}"
set -g @attention "{{attention|peach}}"
set -g @soft_bg "{{soft_bg|surface1}}"
set -g @soft_fg "{{fg}}"
set -g @soft_dim "{{soft_dim|subtext0}}"
set -g @warn_bg "{{warn:mix=surface1:0.6}}"
set -g @window_idle "{{window_idle|muted}}"
set -g @prs "{{prs|mauve}}"
set -g @docker "{{docker|blue}}"
set -g @dev "{{devservers|sky}}"
set -g @selection_bg "{{selection}}"
set -g @ok "{{ok}}"
set -g @warn "{{warn}}"
set -g @error "{{error}}"
# Before varna 0.1.8 these were the prefix and copy-mode colours.
set -g @peach "{{prefix|fg}}"
set -g @sage "{{copy|match}}"

set -g pane-border-style "fg={{line}}"
set -g pane-active-border-style "fg={{accent2}}"
set -g message-style "bg=default,fg={{accent2}}"
set -g mode-style "bg={{accent2}},fg={{ink}}"
set -g copy-mode-selection-style "bg={{accent2}},fg={{ink}}"
set -g copy-mode-position-style "bg={{accent2}},fg={{ink}}"
set -g copy-mode-match-style "bg={{line}},fg={{match}}"
set -g copy-mode-current-match-style "bg={{match}},fg={{ink}}"
set -g copy-mode-mark-style "bg={{mark}},fg={{ink}}"
set -g display-panes-active-colour "{{accent2}}"
set -g display-panes-colour "{{muted}}"
setw -g clock-mode-colour "{{accent2}}"
set -g popup-border-style "fg={{accent}}"
set -g popup-style "bg=default,fg={{fg}}"
set -g menu-style "bg=default,fg={{fg}}"
set -g menu-selected-style "bg={{accent2}},fg={{ink}}"
set -g menu-border-style "fg={{accent}}"
set -g status-style "bg=default,fg={{fg}}"
